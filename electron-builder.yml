appId: dev.oikist.app
productName: oikist
directories:
  output: dist
  buildResources: build

# asar is off deliberately.
#
# node-pty's native binding cannot be loaded from inside an archive. That is solvable
# with unpack rules, but this app is installed on exactly one machine, where an archive
# buys nothing worth a class of silent runtime failures.
#
# The hook relay was the other reason and is gone: agents report their own state on their
# event stream now, so nothing is handed to a CLI as a path to execute.
asar: false

# node-pty is not rebuilt at package time.
#
# The rebuild fails outright — winpty's gyp file shells out to `GetCommitHash.bat`, which
# is not on PATH here — and it has nothing to do: the binding installed by `npm install`
# is the one `npm run dev` and `npx electron .` have been loading under this same Electron
# all along. Rebuilding would produce the artifact that already exists. Verified by
# opening a shell in the packaged app, which is the only proof that matters.
npmRebuild: false

files:
  - out/**
  - resources/**
  - package.json

win:
  icon: build/icon.ico
  # `dir` rather than an installer: the exe stays at a stable path, so it can be pinned
  # once and every later rebuild replaces the file the pin already points at.
  target:
    - dir
